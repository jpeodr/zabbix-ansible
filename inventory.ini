# =====================================================================
# LISTA DE SERVIDORES
# =====================================================================
# Coloque um servidor por linha, no formato:
#
#   nome_no_zabbix ansible_host=IP
#
# O nome antes do ansible_host vira o Hostname do agent.
# Se o nome no Zabbix for diferente, informe na propria linha:
#
#   srv01 ansible_host=10.0.0.11 zabbix_agent2_hostname=NOME-NO-ZABBIX
#
# Depois de editar, remova o "#" do inicio das linhas.

[servers]
# srv-linux-01 ansible_host=10.0.0.11
# srv-linux-02 ansible_host=10.0.0.12

# =====================================================================
# COMO CONECTAR
# =====================================================================

[servers:vars]
ansible_user=ansible
ansible_become=true

# Se o sudo pedir senha, descomente:
# ansible_become_password=SUA_SENHA

# Se usar senha SSH em vez de chave, descomente:
# ansible_password=SUA_SENHA
